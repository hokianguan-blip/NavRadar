LABS.iff={title:'S15 · Identification Friend or Foe (IFF)',sub:'Pick a mode (1, 2, 3/A, C or S) and see what the interrogator asks and what the aircraft sends back.',simTitle:'IFF simulator',playable:true,stepDt:.25,
concept:'<h2>Concept: a coded question and a coded answer</h2><p><b>Plain English:</b> Radar can see that something is there, but not who it is. IFF is like a secret handshake. A unit called the <b>interrogator</b> sends a coded question. A cooperating aircraft’s <b>transponder</b> hears it and automatically sends back a coded answer. The <b>mode</b> decides what is asked and what comes back.</p>'+
 '<div class="grid g3"><div class="card"><h3>1 · Ask</h3><p>The interrogator sends a challenge in one mode.</p></div><div class="card"><h3>2 · Reply</h3><p>The transponder answers with a code or data.</p></div><div class="card"><h3>3 · Show</h3><p>The display marks the aircraft as replying – or as “not identified”.</p></div></div>'+
 '<h3 style="margin-top:16px">The five modes</h3><div class="tbl"><table class="cmp"><caption class="sr">IFF modes 1, 2, 3/A, C and S</caption><thead><tr><th scope="col">Mode</th><th scope="col">Used by</th><th scope="col">The question</th><th scope="col">The reply</th><th scope="col">Good to know</th></tr></thead><tbody>'+
 ['1','2','3A','C','S'].map(k=>{const I=MODEINFO[k];return '<tr><td data-l="Mode">'+I.n+'</td><td data-l="Used by">'+I.who+'</td><td data-l="The question">'+I.ask+'</td><td data-l="The reply">'+I.rep+'</td><td data-l="Good to know">'+I.why+'</td></tr>'}).join('')+'</tbody></table></div>'+
 '<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Limits to know</h3><ul class="tight"><li><b>No reply does not mean hostile.</b> It only means “not identified by IFF”.</li><li>Possible causes: transponder off or in standby, a mode not enabled, a fault, aircraft beyond reach, or different settings.</li><li>Modes 1, 2, 3/A and C are <b>all-call</b>: every aircraft that hears the question can answer. Mode S is <b>selective</b>.</li></ul></div><div class="card"><h3>Keep in mind</h3><ul class="tight"><li>IFF supports identification. Decisions follow approved procedures made by authorised people.</li><li>How each mode is used varies by country, operator and equipment. Use approved data.</li><li>Secure military modes exist. Their details are controlled and are not covered here. No real codes or keys appear in this app.</li></ul></div></div>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>What matters on the aircraft</h3><ul class="tight"><li>The interrogator or transponder, antennas, coaxial cables, control panel and power must all work for a correct exchange.</li><li>Which modes are enabled, and the code settings, are set at the control panel or by configuration. Only authorised staff change them, under approved procedures.</li><li>Antenna connectors, sealing and bonding are common inspection points.</li><li>Report facts: which aircraft, what range, which mode, what the display showed.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>IFF transmits radio energy. Use approved ground-test methods and respect hazard areas and inhibits.</li><li>Never defeat an inhibit, hide a warning or change a setting without approved data.</li><li>Do not treat “no reply” as proof of a fault in your equipment – compare with approved test results first.</li></ul></div></div><div class="notice">No real mode details, codes, keys, power levels or tolerances are given here. They are controlled data in approved documents.</div>',
init:()=>({mode:'3A',power:'on',dist:60,alt:12400,en:{'1':true,'2':true,'3A':true,'C':true,'S':true},codes:{'1':'32','2':'0714','3A':'4321'},enCur:true,codeCur:'4321',p:.95}),
controls:()=>[
 {t:'radio',k:'mode',label:'Interrogation mode',opts:IFF_MODES},
 {t:'select',k:'power',label:'Transponder power',opts:[['on','On'],['stby','Standby'],['off','Off']]},
 {t:'toggle',k:'enCur',label:'This mode is enabled on the transponder'},
 {t:'range',k:'dist',label:'Aircraft distance',min:10,max:150,step:5,fmt:v=>v+' NM'},
 {t:'text',k:'codeCur',label:'Code set on the transponder (digits 0–7)',show:s=>s.mode==='1'||s.mode==='2'||s.mode==='3A'},
 {t:'range',k:'alt',label:'Aircraft pressure altitude',min:0,max:45000,step:100,fmt:v=>Math.round(v).toLocaleString('en-US')+' ft',show:s=>s.mode==='C'||s.mode==='S'},
 {t:'btn',label:'Reset',act:s=>{Object.assign(s,LABS.iff.init())}}],
onChange(st,k){if(k==='mode'){st.enCur=!!st.en[st.mode];st.codeCur=st.codes[st.mode]||''}else if(k==='enCur')st.en[st.mode]=st.enCur;else if(k==='codeCur')st.codes[st.mode]=st.codeCur},
calc(st){const m=st.mode,I=MODEINFO[m],reach=st.dist<=IFF_REACH,on=st.power==='on',en=!!st.en[m],code=st.codes[m]||'',codeOk=!I.len||code.length===I.len;
 let status='ok';if(!reach)status='range';else if(!on)status='power';else if(!en)status='mode';else if(!codeOk)status='code';
 const alt100=Math.round(st.alt/100)*100,altTxt=alt100.toLocaleString('en-US')+' ft';
 let lines=[];if(m==='1')lines=['Mission code: '+code];else if(m==='2')lines=['Unit code: '+code];else if(m==='3A')lines=['Identity code: '+code];else if(m==='C')lines=['Pressure altitude: '+altTxt,'(sent in 100 ft steps)'];else lines=['Unique address: 4A1B2C (example)','Flight ID: DEMO123 (example)','Altitude: '+altTxt];
 const why={range:'Aircraft is beyond IFF reach.',power:'Transponder is '+(st.power==='stby'?'in standby':'off')+'.',mode:'This mode is not enabled on the transponder.',code:'The code is incomplete – enter '+I.len+' digits.'}[status]||'';
 const others=[{x:iffX(35),y:72,r:35,rep:m!=='S'},{x:iffX(125),y:170,r:125,rep:false}];
 return{m,I,reach,on,en,code,codeOk,status,lines,alt100,altTxt,why,others}},
tick(st,dt,ctx,force){if(!ctx.playing&&!force)return false;st.p+=force?.25:dt/3;if(st.p>1.4)st.p=0;return true},
views:SV('ifsc','0 0 400 290','IFF scene','wide'),
legend:'<ul class="legend"><li><b>ASK</b> = question going out</li><li><b>REPLY</b> = coded answer coming back</li><li><b>✕</b> = no usable reply</li><li>Dashed line = IFF reach (example)</li></ul><p class="cap">Meaning is shown by labels and shapes, not colour alone. The highlighted button at the top is the selected mode.</p>',
draw(st,c,root){const m=st.mode,ax=iffX(st.dist),ay=118,q=st.p,ok=c.status==='ok';
 let s=TX(22,26,'Mode',{s:11,c:'#BAE6FD'});
 IFF_MODES.forEach((mm,i)=>{const x=44+i*64,sel=mm[0]===m;s+='<rect x="'+x+'" y="8" width="56" height="26" rx="8" fill="'+(sel?'#FBBF24':'none')+'" stroke="'+(sel?'#F8FAFC':'#7FB4D6')+'" stroke-width="'+(sel?2.5:1.5)+'"/><text x="'+(x+28)+'" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="'+(sel?'#102A43':'#E0F2FE')+'">'+(sel?'✓ ':'')+mm[1]+'</text>'});
 /* reach line */
 s+=LN(iffX(IFF_REACH),54,iffX(IFF_REACH),196,'#FB7185',2,'5 4')+TX(iffX(IFF_REACH),50,'IFF reach (example)',{s:12,c:'#FDA4AF'});
 /* interrogator */
 s+='<rect x="26" y="98" width="28" height="40" rx="4" fill="#38BDF8" stroke="#F8FAFC" stroke-width="1.5"/><path d="M40,98 L40,84 M32,84 L48,84" stroke="#F8FAFC" stroke-width="2"/>'+TX(40,156,'Interrogator',{s:12});
 /* other aircraft */
 c.others.forEach((o,i)=>{const inR=o.r<=IFF_REACH;s+='<g transform="translate('+o.x+','+o.y+') rotate(-90) scale(.55)"><path d="'+PLANE+'" fill="#94A3B8"/></g>';
  const t=(m==='S')?'stays quiet':inR?(q>=.5?'also replies':'other aircraft'):'out of reach';s+=TX(o.x,o.y+22,t,{s:11,c:'#BAE6FD'});
  if(m!=='S'&&inR&&q>=.5)s+='<rect x="'+(o.x+12)+'" y="'+(o.y-20)+'" width="44" height="15" rx="4" fill="#2DD4BF" stroke="#F8FAFC"/>'+'<text x="'+(o.x+34)+'" y="'+(o.y-9)+'" text-anchor="middle" font-size="10" font-weight="800" fill="#102A43">REPLY</text>'});
 /* main aircraft */
 s+='<g transform="translate('+ax+','+ay+') rotate(-90) scale(.9)"><path d="'+PLANE+'" fill="#F8FAFC" stroke="#102A43"/></g>'+TX(ax,ay+34,(m==='S'?'Addressed aircraft':'Aircraft')+' · '+st.dist+' NM',{s:12,a:ax>300?'end':'middle'});
 /* packets */
 const tgtAsk=c.status==='range'?iffX(IFF_REACH)-4:ax-22,lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
 const pk=(x,y,w,txt,fill,fg)=>'<rect x="'+(x-w/2)+'" y="'+(y-9)+'" width="'+w+'" height="18" rx="5" fill="'+fill+'" stroke="#F8FAFC" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" font-size="10" font-weight="800" fill="'+fg+'">'+txt+'</text>';
 if(q<.5){s+=pk(lerp(86,tgtAsk,q/.5),ay-4,38,'ASK','#FBBF24','#102A43')+arrow(lerp(86,tgtAsk,q/.5)+22,ay-4,lerp(86,tgtAsk,q/.5)+36,ay-4,'#F8FAFC',2)}
 else{
  if(ok){const px=lerp(ax-22,96,(q-.5)/.5);s+=pk(px,ay+12,52,'REPLY','#2DD4BF','#102A43')+arrow(px-28,ay+12,px-42,ay+12,'#F8FAFC',2)}
  else{const xx=c.status==='range'?iffX(IFF_REACH):ax-26;s+=TX(xx,ay-8,'✕',{s:20,w:800,c:'#FDA4AF'})}
 }
 /* result card */
 const cy=204,ch=c.lines.length>2?82:68;
 s+='<rect x="16" y="'+cy+'" width="368" height="'+ch+'" rx="10" fill="#0B2239" stroke="'+(ok?'#2DD4BF':'#FB7185')+'" stroke-width="3"'+(ok?'':' stroke-dasharray="7 5"')+'/>';
 if(ok){s+=TX(200,cy+22,'✓ Reply received – '+c.I.n,{s:13,w:800,c:'#2DD4BF'});c.lines.forEach((ln,i)=>{s+=TX(200,cy+42+i*16,ln,{s:13})})}
 else{s+=TX(200,cy+22,'✕ No usable reply – not identified by IFF',{s:13,w:800,c:'#FDA4AF'})+TX(200,cy+42,c.why,{s:13})+TX(200,cy+59,'This does not show what the aircraft is.',{s:12,c:'#BAE6FD'})}
 setSvg(root,'ifsc',s,'IFF scene. Interrogation '+c.I.n+'. Aircraft at '+st.dist+' nautical miles. '+(ok?'Reply received: '+c.lines.join(', ')+'.':'No usable reply. '+c.why)+(m==='S'?' Only the addressed aircraft answers.':' Other aircraft in range also reply.'))},
live(st,c){const m=st.mode,I=c.I,ok=c.status==='ok';let msg='';
 if(!ok)msg='No reply only means “not identified by IFF”. It is not proof of what the aircraft is. '+(c.status==='range'?'Move the aircraft closer.':c.status==='power'?'Switch the transponder on.':c.status==='mode'?'Enable this mode on the transponder.':'Complete the code.');
 else if(m==='S')msg='Mode S is selective: only the aircraft with the matching address answers. The other aircraft stay quiet.';
 else msg='All-call mode: every aircraft in reach that hears the question can answer, so replies can overlap.';
 return{rows:[['Mode',I.n],['Used by',I.who],['Interrogator asks',I.ask],['Reply carries',I.rep],['Who answers',m==='S'?'Only the addressed aircraft':'Every aircraft in reach (all-call)'],['This aircraft',ok?'Reply received':'No usable reply'],['Reply content',ok?c.lines.join(' · '):'—']],eq:I.why,msg}},
tasks:[{t:'Get a Mode C reply that shows exactly 20,000 ft.',hint:'Choose Mode C and move the altitude slider to 20,000 ft.',test:(s,c)=>s.mode==='C'&&c.status==='ok'&&c.alt100===20000},{t:'Get a Mode 3/A reply with an identity code of your own (not 4321).',hint:'Choose Mode 3/A and type four digits (0–7) in the code box.',test:(s,c)=>s.mode==='3A'&&c.status==='ok'&&s.codes['3A'].length===4&&s.codes['3A']!=='4321'},{t:'Make the aircraft “not identified”: switch the transponder to Standby while it is in range.',hint:'Keep the distance at 100 NM or less and choose Standby.',test:(s,c)=>c.reach&&s.power!=='on'},{t:'Switch off Mode 2 on the transponder and see that a Mode 2 question gets no reply.',hint:'Choose Mode 2, then untick “This mode is enabled”.',test:(s,c)=>s.mode==='2'&&c.status==='mode'},{t:'Use Mode S and see that the other aircraft stay quiet.',hint:'Choose Mode S with the aircraft in range.',test:(s,c)=>s.mode==='S'&&c.status==='ok'}],
predict:{q:'You interrogate in Mode C. What does a normal reply carry?',o:['Only an identity code from air traffic control','The aircraft’s pressure altitude','A unique address and a text message','A short military mission code'],a:1,e:'Mode C reports pressure altitude in 100 ft steps. It is altitude from air pressure, not height above the ground.',hint:'Choose Mode C and move the altitude slider. Watch the reply card change.'}};

/* ===================== RADALT ===================== */
const RA_MAX=2500, RA_B=100e6, RA_T=1e-3; /* illustrative working height, sweep bandwidth and sweep time */
const TERR=[['flat','Flat ground (sea level)'],['hill','Hill'],['cliff','Plateau edge'],['gorge','Valley']];
const elevAt=(p,t)=>t==='hill'?1500*Math.exp(-Math.pow((p-50)/16,2)):t==='cliff'?100+1300/(1+Math.exp((p-50)/3)):t==='gorge'?1200-1200*Math.exp(-Math.pow((p-50)/9,2)):0;
LABS.radalt={title:'S16 · Radar Altimeter (RADALT)',sub:'Measure height above the ground directly below and compare it with barometric altitude.',simTitle:'Radar altimeter simulator',playable:true,stepDt:.4,
concept:'<h2>Concept: a tape measure aimed at the ground</h2><p><b>Plain English:</b> A radar altimeter (RADALT) shines radio waves straight down and times the echo from the ground, like aiming a tape measure at the floor. The longer the echo takes, the greater the height. It tells you the height above <i>whatever is directly beneath the aircraft</i>, hills and all.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li>Two antennas point down: one transmits, one receives.</li><li>Many radio altimeters use an <b>FMCW</b> sweep: the <b>beat frequency</b> is proportional to height. Others use short pulses.</li><li>Height = c × T × fb ÷ (2 × B), as in the FMCW radar module.</li><li>It is a <b>low-height</b> sensor. Above its working range there is no valid reading.</li><li>The height can be used by other systems such as ground proximity warning or flight controls. What it feeds varies by aircraft.</li></ul></div><div class="card"><h3>Radar altitude or barometric altitude?</h3><ul class="tight"><li><b>Barometric altitude</b> comes from air pressure. It does not know about the ground.</li><li><b>Radar altitude</b> is the measured height above the terrain below.</li><li>Fly over a hill at constant barometric altitude and the radar altitude <b>falls</b>.</li><li>The <b>low-height alert</b> value is set by the crew. An alert shows when radar altitude is at or below it.</li></ul></div></div><p class="formula">Height above ground = barometric altitude − terrain elevation (simplified)</p><p class="foot">The working height, sweep bandwidth and sweep time here are illustrative. Real values are in approved data.</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>What matters on the aircraft</h3><ul class="tight"><li>The receiver-transmitter, two antennas, the coaxial cables and the indicator must all be healthy.</li><li>Cable <b>type and length</b> can affect the reading. Use only the cables specified in approved data. Never cut, splice or shorten them.</li><li>Antenna installation, sealing, bonding and skin condition matter.</li><li>A <b>NO DATA</b> condition high above the ground is normal for a low-height sensor.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Use approved test equipment and test methods. The system transmits, so respect hazard areas.</li><li>Never hide a flag, enter an offset or compensate for a wrong reading without approved data.</li><li>Record both the radar and barometric readings when reporting a difference.</li></ul></div></div><div class="notice">No tolerances, cable lengths or adjustment values are given here. They are in approved manuals.</div>',
init:()=>({alt:2200,pos:20,terr:'hill',warn:300}),
controls(){return [{t:'range',k:'alt',label:'Barometric altitude (ft above sea level, simplified)',min:0,max:5000,step:50,fmt:v=>Math.round(v).toLocaleString('en-US')+' ft'},{t:'range',k:'pos',label:'Position along track',min:0,max:100,step:1,fmt:v=>Math.round(v)+'%'},{t:'select',k:'terr',label:'Terrain below',opts:TERR},{t:'range',k:'warn',label:'Low-height alert setting (set by the crew)',min:0,max:1000,step:50,fmt:v=>v+' ft'},{t:'btn',label:'Reset',act:s=>Object.assign(s,LABS.radalt.init())}]},
calc(st){const el=elevAt(st.pos,st.terr),raw=st.alt-el,below=raw<0,agl=Math.max(0,raw),valid=!below&&agl<=RA_MAX,fb=2*(agl*.3048)*RA_B/(3e8*RA_T);return{el,agl,below,valid,fb,alert:valid&&agl<=st.warn}},
tick(st,dt,ctx,force){if(!ctx.playing&&!force)return false;st.pos+=force?10:dt*6;if(st.pos>100)st.pos=0;return true},
views:SV('raside','0 0 400 230','Side view of the aircraft and the ground')+SV('raind','0 0 400 230','Radar altimeter indicator and sweeps'),
legend:'<ul class="legend"><li>'+sw('#38BDF8','5 4')+'Radio beam to the ground below</li><li>'+sw('#FBBF24')+'Height above ground (radar altitude)</li><li>'+sw('#F8FAFC','2 4')+'Sea level</li></ul><p class="cap">Left: side view (heights exaggerated for clarity). Right: the indicator, with the transmitted and received sweeps below it.</p>',
draw(st,c,root){const y0=205,k=.034,X=p=>20+p*3.6,Y=ft=>y0-ft*k,ax=X(st.pos),ay=Y(st.alt),gy=Y(c.el);
 let s='';let poly='M20,'+y0;for(let p=0;p<=100;p+=2)poly+=' L'+X(p)+','+Y(elevAt(p,st.terr)).toFixed(1);poly+=' L380,'+(y0+20)+' L20,'+(y0+20)+'Z';
 s+='<path d="'+poly+'" fill="#57534E" stroke="#A8A29E" stroke-width="1.5"/>'+LN(20,y0,380,y0,'#F8FAFC',1,'2 4')+TX(30,y0-4,'Sea level',{s:10,c:'#E7E5E4',a:'start'});
 if(c.below)s+=TX(200,120,'Barometric altitude is below the terrain – raise it',{s:12,c:'#FDA4AF'});
 else{const ex=c.valid?gy:Math.min(ay+RA_MAX*k,gy);s+='<polygon points="'+ax+','+ay+' '+(ax-14)+','+ex+' '+(ax+14)+','+ex+'" fill="#38BDF8" fill-opacity=".28" stroke="#38BDF8" stroke-dasharray="5 4"/>';
  if(c.valid)s+=arrow(ax+26,ay+8,ax+26,gy-2,'#FBBF24',2.5)+arrow(ax+26,gy-2,ax+26,ay+8,'#FBBF24',2.5)+TX(ax+32,(ay+gy)/2+4,Math.round(c.agl).toLocaleString('en-US')+' ft',{s:12,w:700,c:'#FBBF24',a:ax>300?'end':'start'});
  else s+=TX(ax+20,ex-6,'×',{s:16,w:800,c:'#FDA4AF'})+TX(Math.min(ax+26,330),ex+12,'no usable echo (too high)',{s:10,c:'#FDA4AF'})}
 s+='<g transform="translate('+ax+','+ay+') rotate(90) scale(.7)"><path d="'+PLANE+'" fill="#F8FAFC"/></g>'+TX(ax,Math.max(ay-14,12),'Barometric '+Math.round(st.alt).toLocaleString('en-US')+' ft',{s:11,a:ax>300?'end':'middle'})+TX(Math.min(ax,340),y0+16,'Terrain below: '+Math.round(c.el).toLocaleString('en-US')+' ft',{s:10,c:'#E7E5E4'});
 setSvg(root,'raside',s,'Side view. Aircraft at barometric altitude '+Math.round(st.alt)+' feet over terrain at '+Math.round(c.el)+' feet. '+(c.below?'The altitude is below the terrain.':c.valid?'Radar altitude is '+Math.round(c.agl)+' feet.':'The aircraft is above the working range, so there is no valid radar altitude.'));
 let d='<rect x="20" y="12" width="360" height="86" rx="10" fill="#0B2239" stroke="#38BDF8" stroke-width="3"/>'+TX(36,32,'RADAR ALTITUDE',{s:11,c:'#BAE6FD',a:'start'})+TX(200,78,c.valid?Math.round(c.agl)+' ft':'– – – –',{s:40,w:800,c:c.valid?'#F8FAFC':'#7FB4D6'});
 if(c.alert)d+='<rect x="236" y="22" width="134" height="26" rx="5" fill="#FB7185"/>'+TX(303,40,'LOW HEIGHT',{s:13,w:800,c:'#102A43'});
 if(!c.valid&&!c.below)d+='<rect x="236" y="22" width="134" height="26" rx="5" fill="#FBBF24"/>'+TX(303,40,'NO DATA',{s:13,w:800,c:'#102A43'});
 d+=TX(364,92,'Alert set: '+st.warn+' ft',{s:10,c:'#BAE6FD',a:'end'});
 const x0=40,xe=370,yb=206,yt=124,Wp=(xe-x0)/2,fr=c.valid?clamp(c.agl/RA_MAX,.03,1)*.35:0,dx=Wp*fr;
 d+=LN(x0,yb+4,xe+4,yb+4,'#BAE6FD',2)+LN(x0-4,yt-6,x0-4,yb+4,'#BAE6FD',2)+TX(x0-8,yt+40,'Frequency',{s:10,c:'#BAE6FD',r:-90})+TX(200,226,'Time →',{s:10,c:'#BAE6FD'});
 const fT=x=>{const ph=(((x-x0)/Wp)%1+1)%1;return yb-ph*(yb-yt)};let p1='',p2='';for(let x=x0;x<=xe;x++){p1+=(p1?' L':'M')+x+','+fT(x).toFixed(1)}
 d+='<path d="'+p1+'" fill="none" stroke="#38BDF8" stroke-width="3"/>';
 if(c.valid){for(let x=x0+dx;x<=xe;x++){p2+=(p2?' L':'M')+x+','+fT(x-dx).toFixed(1)}d+='<path d="'+p2+'" fill="none" stroke="#FB7185" stroke-width="3" stroke-dasharray="7 4"/>';const bx=x0+Wp*.6+dx,y1=fT(bx),y2=fT(bx-dx);d+=arrow(bx,y2,bx,y1,'#FBBF24',3)+arrow(bx,y1,bx,y2,'#FBBF24',3)+TX(bx+8,(y1+y2)/2+4,'fb = '+fmtHz(c.fb),{s:11,w:700,c:'#FBBF24',a:bx>270?'end':'start'})}
 else d+=TX(230,170,'No usable echo',{s:12,c:'#FDA4AF'});
 d+=TX(x0+4,yt-12,'Sent sweep',{s:10,c:'#38BDF8',a:'start'})+TX(x0+110,yt-12,'Echo (delayed)',{s:10,c:'#FDA4AF',a:'start'});
 setSvg(root,'raind',d,'Radar altimeter indicator. '+(c.valid?'Reads '+Math.round(c.agl)+' feet.':c.below?'No reading.':'NO DATA flag shown.')+(c.alert?' Low height alert shown.':''))},
live(st,c){return{rows:[['Barometric altitude',Math.round(st.alt).toLocaleString('en-US')+' ft'],['Terrain below',Math.round(c.el).toLocaleString('en-US')+' ft'],['Radar altitude (height above ground)',c.below?'—':c.valid?Math.round(c.agl).toLocaleString('en-US')+' ft':'NO DATA (above working range)'],['Beat frequency (FMCW, illustr.)',c.valid?fmtHz(c.fb):'—'],['Low-height alert',c.alert?'ON':'off'],['Working height (illustrative)','up to '+RA_MAX.toLocaleString('en-US')+' ft']],
 eq:c.valid?'Height = barometric − terrain<br>= '+Math.round(st.alt)+' − '+Math.round(c.el)+' = <b>'+Math.round(c.agl)+' ft</b><br>Beat frequency fb = 2 × h × B ÷ (c × T)':'No valid height to calculate.',
 msg:c.below?'In this simulation the barometric altitude is below the terrain, so no height can be shown. Raise the altitude.':!c.valid?'Above the working range the radio altimeter gives no valid height. A NO DATA condition here is expected, not a fault.':c.alert?'Low-height alert: the radar altitude is at or below the value set by the crew.':'Move along the track: the terrain changes, and so does the radar altitude, while the barometric altitude stays the same.'}},
