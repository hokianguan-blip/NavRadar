['d1','adf','What does the needle on an ADF indicator show?',['The aircraft’s magnetic heading','The direction of the ground station relative to the aircraft’s nose','The distance to the station','The wind direction'],1,'The ADF needle shows the relative bearing: the angle from the aircraft’s nose to the station.'],

['f19','fmcw','The FMCW beat frequency is produced by comparing…',['The transmitted frequency now with the received (delayed) frequency','Two different aircraft','The antenna and the display','Wind speed and temperature'],0,'The receiver mixes the current transmit signal with the delayed echo.'],

['f29','radalt','What does a radar altimeter (RADALT) measure?',['Height above the terrain directly below the aircraft','Altitude from air pressure','Distance to the next airport','Ground speed'],0,'A radio altimeter aims radio waves down and times the echo from the ground, so it measures height above whatever is directly beneath.'],

/* ========= Glossary ========= */
const GLOSS=[
['ADF (Automatic Direction Finder)','A receiver whose needle points toward a ground radio station (NDB) relative to the aircraft nose.'],
['NDB (Non-Directional Beacon)','A ground radio transmitter that sends a signal in all directions for ADF to home on.'],
['Relative bearing (RB)','The angle from the aircraft’s nose, measured clockwise, to the station.'],
['Magnetic bearing to station','Heading + relative bearing (subtract 360° if the total is above 360°).'],
['Loop antenna / sense antenna','The loop gives direction; the sense antenna resolves the ahead/behind ambiguity.'],
['VOR (VHF Omnidirectional Range)','A ground VHF station that lets an aircraft work out which radial it is on.'],
['Radial','A direction measured outward FROM a VOR station, such as the 090 radial (east).'],
['OBS (Omni-Bearing Selector)','The knob that selects the course shown by the VOR indicator.'],
['CDI (Course Deviation Indicator)','The needle that shows whether the selected course is left or right of the aircraft.'],
['TO/FROM indication','Shows whether flying the selected course would take the aircraft toward or away from the station.'],
['Heading','The direction the aircraft nose is pointing.'],
['Bearing to the station','The direction from the aircraft to the station.'],
['Radar','Radio detection and ranging: sends radio waves and listens for reflections.'],
['Echo','The reflected signal returning from a target.'],
['Pulse radar','Sends short bursts and measures the time until each echo returns.'],
['PRF / PRT','Pulse repetition frequency (pulses per second) and pulse repetition time (time between pulses = 1/PRF).'],
['Pulse width','The duration of each transmitted pulse; longer pulses give coarser range resolution.'],
['Range resolution','The smallest separation at which two targets are seen as two echoes (about c×τ/2 for pulse radar).'],
['Maximum unambiguous range','The farthest range with no confusion between echoes from different pulses (about c/(2×PRF)).'],
['Range ambiguity','An echo from a far target arriving after the next pulse and appearing at a wrong, nearer range.'],
['CW radar','Continuous wave radar: transmits constantly; basic versions sense speed but not range.'],
['Doppler effect','A change in received frequency caused by relative motion between source and receiver.'],
['Doppler shift','The frequency change caused by radial motion; about 2×v×f/c for radar.'],
['Radial velocity','The part of a target’s velocity along the line of sight to the radar.'],
['Line of sight','The straight line between the radar and the target.'],
['FMCW','Frequency-modulated continuous wave: a continuous signal whose frequency is swept so range can be found.'],
['Sweep / chirp','A deliberate rise (or fall) of transmitted frequency over time.'],
['Beat frequency','The difference between the transmitted and received frequencies in an FMCW radar.'],
['Bandwidth (sweep)','The total frequency range covered in one sweep; wider bandwidth gives finer range resolution.'],
['Weather radar','An airborne radar that shows precipitation echoes ahead of the aircraft.'],
['Pulse-Doppler','A radar that uses pulses for range and Doppler processing for motion information.'],
['Antenna tilt','Pointing the beam up or down relative to horizontal.'],
['Ground clutter','Unwanted echoes from the ground when the beam strikes it.'],
['Attenuation','Weakening of the radar signal as it passes through heavy precipitation.'],
['Shadow','A region behind a strong cell where weather may be hidden because of attenuation.'],
['AMM / CMM / WDM','Aircraft Maintenance Manual, Component Maintenance Manual and Wiring Diagram Manual: approved maintenance data.'],
['BIT / BITE','Built-in test (equipment): self-test functions of an avionics unit.'],
['IFF (Identification Friend or Foe)','A system in which an interrogator sends a coded challenge and a cooperating transponder sends a coded reply, to help identify an aircraft.'],
['Interrogator','The IFF unit that sends the coded challenge signal.'],
['Transponder','A unit that receives an interrogation and automatically sends a coded reply.'],
['Primary radar','Radar that detects a target from its reflected echo. The target does not need to cooperate.'],
['Secondary radar','Radar that relies on a reply from the target’s transponder, such as IFF.'],
['IFF mode','The type of question the interrogator asks and the kind of reply expected, such as Mode 1, 2, 3/A, C or S.'],
['Mode 1','A military mode. The reply is a short mission code. What the code means is set by operating procedures.'],
['Mode 2','A military mode. The reply is a 4-digit unit or aircraft code, normally set on the ground.'],
['Mode 3/A (squawk)','A civil and military mode. The reply is a 4-digit identity code assigned by air traffic control.'],
['Mode C','A civil and military mode. The reply is the aircraft’s pressure altitude in 100 ft steps.'],
['Mode S','A selective mode. Each aircraft has a unique address, and only the addressed aircraft replies. Replies can carry extra data such as altitude and flight identification.'],
['All-call','An interrogation that every aircraft in range can answer. Modes 1, 2, 3/A and C work this way (simplified).'],
['Pressure altitude','Altitude worked out from air pressure. It is not the height above the ground.'],
['Cooperating aircraft','An aircraft whose transponder answers interrogations.'],
['RADALT (radar altimeter)','A radio altimeter that measures height above the ground directly below the aircraft.'],
['Height above ground (AGL)','The vertical distance between the aircraft and the terrain directly below it.'],
['Barometric altitude','Altitude worked out from air pressure, not from the ground below.'],
['Low-height alert','A crew-set value; an alert is shown when the radar altitude falls to or below it.']
];

function intro(id,svg,lab){const I={

 return page(I.t,'<div class="grid g2"><div class="card"><h2>In plain English</h2><p>'+I.plain+'</p>'+svg+'</div><div class="card"><h2>By the end you can…</h2><ul class="tight">'+I.outs.map(o=>'<li>'+o+'</li>').join('')+'</ul><h3>Key words</h3><p>'+I.terms.map(t=>'<span class="pill">'+t+'</span> ').join('')+'</p><p><button class="btn" data-go="S23">Open glossary</button></p></div></div>'+NOTICE+'<div class="btnrow"><button class="btn pri" data-go="'+lab+'">Start the simulator →</button></div>')}

RENDER.S09={html(){const card=(s,t,d)=>'<div class="card"><h3>'+t+'</h3><p>'+d+'</p><button class="btn" data-go="'+s+'">Open</button></div>';
 return page('Radar Hub','<div class="card"><h2>Radar in plain English</h2><p><b>Radar</b> means <i>RAdio Detection And Ranging</i>. A radar sends out radio waves and listens for the reflection (the <b>echo</b>), like shouting in a canyon and listening. By studying the echo it can work out <b>where</b> something is, how <b>far</b> away, and how <b>fast</b> it is moving.</p></div><h2 style="margin-top:16px">The radar family</h2><div class="grid g3">'+
 card('S10','Pulse radar','Short bursts and echo timing. Best for measuring range.')+card('S11','Continuous-wave (CW)','A steady signal. Senses speed through Doppler, but not range.')+card('S12','Doppler effect','How motion towards or away changes the echo frequency.')+card('S13','FMCW','A swept signal that allows range measurement while transmitting continuously.')+card('S14','Weather radar','Pulse-Doppler principles to show precipitation ahead.')+card('S15','Identification Friend or Foe (IFF)','A coded question and reply, in modes 1, 2, 3/A, C and S, that helps identify a cooperating aircraft.')+card('S16','Radar Altimeter (RADALT)','Radio waves aimed straight down to measure height above the ground.')+card('S17','Comparison','See all types side by side.')+'</div>'+NOTICE+'<div class="btnrow"><button class="btn good" data-act="complete" data-mod="hub">'+(S.completed.hub?'✓ Hub completed':'Mark Radar Hub complete')+'</button></div>')}};
RENDER.S17={html(){const rows=[['Pulse radar','Yes – from echo time','Indirectly (change of range, or Doppler processing)','Short pulses repeated; simple idea','Range ambiguity, minimum range, resolution set by pulse width'],['Basic CW radar','No','Yes – Doppler shift','Continuous, unchanging signal','No range; may need extra processing to show direction of motion'],['FMCW radar','Yes – from beat frequency','Can be derived with sweeps','Continuous frequency sweep','Bandwidth and sweep time set resolution; complexity of signal processing'],['Pulse-Doppler (weather) radar','Yes – pulses give range','Yes – Doppler processing, used for motion information in some systems','Pulses plus Doppler processing','Attenuation, ground clutter, tilt management; colours and controls vary'],['IFF (secondary radar)','Yes – from the time the reply takes to arrive','Not its main purpose','Coded interrogation (mode 1, 2, 3/A, C or S), then a coded reply from the aircraft’s transponder','Needs a cooperating transponder; no reply does not prove what an aircraft is'],['Radar altimeter (RADALT)','Height straight down, from the echo (often FMCW)','Not its main purpose','Radio waves aimed at the ground below','Low heights only; no valid height above its working range; cable and antenna condition matter']];
 return page('Radar Comparison','<div class="tbl"><table class="cmp"><caption class="sr">Comparison of radar types</caption><thead><tr><th scope="col">Type</th><th scope="col">Measures range?</th><th scope="col">Measures speed?</th><th scope="col">How it transmits</th><th scope="col">Main limitations</th></tr></thead><tbody>'+rows.map(r=>'<tr><td data-l="Type">'+r[0]+'</td><td data-l="Measures range?">'+r[1]+'</td><td data-l="Measures speed?">'+r[2]+'</td><td data-l="How it transmits">'+r[3]+'</td><td data-l="Main limitations">'+r[4]+'</td></tr>').join('')+'</tbody></table></div><div class="panel" style="margin-top:16px"><h2>Which one fits the need?</h2><div class="ctrl"><label for="need">I need to…</label><select id="need"><option value="">Choose…</option><option value="r">Measure distance to a target</option><option value="v">Measure only closing speed</option><option value="rs">Measure distance continuously at short range</option><option value="w">Show precipitation ahead of an aircraft</option><option value="i">Check whether a detected aircraft answers a coded challenge</option><option value="a">Measure height above the ground directly below</option></select></div><div class="fb" id="needout" aria-live="polite"></div></div>'+NOTICE+'<div class="btnrow"><button class="btn good" data-act="complete" data-mod="cmp">'+(S.completed.cmp?'✓ Comparison completed':'Mark comparison complete')+'</button></div>')},
 post(){$('#need').addEventListener('change',e=>{const m={r:'<b>Pulse radar</b> – time the echo and divide by two.',v:'<b>Basic CW radar</b> – the Doppler shift gives radial speed.',rs:'<b>FMCW radar</b> – the beat frequency gives range while transmitting continuously (used in some short-range sensors).',i:'<b>IFF</b> – the interrogator sends a coded challenge and a cooperating transponder replies. No reply only means “not identified”.',a:'<b>Radar altimeter (RADALT)</b> – radio waves aimed straight down give height above the terrain below.',w:'<b>Pulse-Doppler weather radar</b> – pulses give range and the scanning antenna gives direction; Doppler processing can add motion information in some systems.'}[e.target.value];$('#needout').innerHTML=m?'<div class="box" style="padding:10px 14px;border-radius:8px;border-left:6px solid var(--sky);background:#E8F6FE">'+m+'</div>':''})}};

 else if(c.step===2)b+='<fieldset><legend>Choose the safest next diagnostic step.</legend>'+sc.steps.map((s,k)=>'<label class="opt'+(c.pick===k?' sel':'')+'"><input type="radio" name="scn_pick" value="'+k+'"'+(c.pick===k?' checked':'')+'><span>'+esc(s)+'</span></label>').join('')+'</fieldset>'+bk('<button class="btn" data-act="scn" data-d="-1">← Back</button><button class="btn pri" data-act="scn" data-d="1" id="scnNext"'+(c.pick!==null?'':' disabled')+'>Continue →</button>');
 else if(c.step===3)b+='<div class="ctrl"><label for="scnReason"><b>Explain your reasoning</b> – link the symptoms to your chosen area and say why your step is safe and approved (at least a short sentence).</label><textarea id="scnReason" rows="4">'+esc(c.reason)+'</textarea></div>'+bk('<button class="btn" data-act="scn" data-d="-1">← Back</button><button class="btn good" data-act="scnsubmit">Submit</button>');
 else{const d=S.work.done[i]||{};b+='<h2>Feedback</h2><div class="fb"><div class="box '+(d.areaOk?'ok':'no')+'" style="padding:10px 14px;border-radius:8px;border-left:6px solid;margin-bottom:8px"><strong>'+(d.areaOk?'✓ System area correct: ':'✗ System area: ')+'</strong>'+(d.areaOk?'':'The best answer is “'+AREAS[sc.area]+'”. ')+esc(sc.whyA)+'</div><div class="box '+(d.stepOk?'ok':'no')+'" style="padding:10px 14px;border-radius:8px;border-left:6px solid;margin-bottom:8px"><strong>'+(d.stepOk?'✓ Safe step correct: ':'✗ Safe next step: ')+'</strong>'+(d.stepOk?'':'The safest step is “'+esc(sc.steps[sc.ok])+'”. ')+esc(sc.whyS)+'</div><div class="box" style="padding:10px 14px;border-radius:8px;border-left:6px solid var(--sky);background:#E8F6FE"><strong>Your reasoning:</strong> '+esc(c.reason)+'<br><strong>Model reasoning:</strong> '+esc(sc.model)+'<br><em>Compare the two. Your instructor may discuss your reasoning with you.</em></div></div>'+

 b+='</div>';return page('Fault Scenario '+(i+1)+' of '+SCN.length+': '+sc.t,'<p style="margin-top:-6px;color:var(--muted)">System: '+sc.sys+'</p>'+b)},
 post(){const i=scnIdx();const r=$('#scnReason');if(r)r.addEventListener('input',()=>{scnCur(i).reason=r.value;save()});

/* ===================== ADF ===================== */
LABS.adf={title:'S06 · ADF Indication',sub:'Rotate the aircraft, move the NDB training station and watch the ADF needle.',simTitle:'ADF simulator',
concept:'<h2>Concept: the radio compass needle</h2><p><b>Plain English:</b> A ground beacon sends out radio waves in every direction. The ADF needle always points toward that beacon – like a compass needle that points to a lighthouse instead of north.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li><b>NDB</b> (Non-Directional Beacon): the ground transmitter.</li><li><b>Relative bearing (RB)</b>: angle from the aircraft’s nose, clockwise, to the station. The needle shows RB.</li><li><b>Bearing to the station</b> = heading + RB (subtract 360° if above 360°).</li><li>A <b>loop</b> antenna finds direction; a <b>sense</b> antenna says ahead or behind.</li></ul></div><div class="card"><h3>Good to know</h3><ul class="tight"><li><b>Station passage:</b> the needle swings from ahead to behind as you cross the station, and may be unsteady overhead.</li><li><b>Signal loss:</b> the needle is not valid; what it does varies by equipment.</li><li>Thunderstorm static, terrain and night propagation can degrade ADF indications.</li></ul></div></div><p class="formula">Bearing to station = Heading + Relative bearing</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>Why it matters on the aircraft</h3><ul class="tight"><li>ADF receiver, loop and sense antennas, cabling and the indicator must all be healthy for a trustworthy needle.</li><li>Antenna and coaxial connector condition, sealing and bonding are common inspection points.</li><li>Ground tests use approved test sources – never rely on a live NDB being available.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Use the approved AMM task for removal, installation and tests.</li><li>Never adjust or bypass anything without approved data.</li><li>Report unexplained needle errors with facts: when, where, weather.</li></ul></div></div><div class="notice">This screen does not give any antenna torque values, test limits or procedures. Those are in the approved manuals.</div>',
init:()=>({hdg:60,ae:90,an:50,se:140,sn:150,loss:false,needle:null,fly:false,demo:false,ds:0}),
controls(){const rm=reduceMotion();return [
 {t:'range',k:'hdg',label:'Aircraft heading',min:0,max:359,step:1,fmt:v=>pad3(v)},
 {t:'range',k:'se',label:'Station position – east',min:10,max:190,step:1,fmt:v=>f0(v)+' units'},
 {t:'range',k:'sn',label:'Station position – north',min:10,max:190,step:1,fmt:v=>f0(v)+' units'},
 {t:'toggle',k:'loss',label:'Signal loss (training demonstration)'},
 rm?{t:'btn',label:'Step aircraft forward 10 units',act:st=>{const h=rad(st.hdg);st.ae=clamp(st.ae+10*Math.sin(h),0,200);st.an=clamp(st.an+10*Math.cos(h),0,200)}}:{t:'toggle',k:'fly',label:'Aircraft flies forward'},
 {t:'btn',label:rm?'Station passage: next position (before / abeam / after)':'Station-passage demonstration',act:st=>{st.hdg=0;st.se=100;st.sn=100;st.ae=104;st.fly=false;if(rm){st.ds=(st.ds%3)+1;st.an=[30,100,170][st.ds-1]}else{st.an=20;st.demo=true}}},
 {t:'btn',label:'Reset positions',act:st=>{Object.assign(st,{hdg:60,ae:90,an:50,se:140,sn:150,loss:false,fly:false,demo:false,ds:0})}}]},
calc(st){const de=st.se-st.ae,dn=st.sn-st.an,brg=norm360(deg(Math.atan2(de,dn))),rb=norm360(brg-st.hdg);return{brg,rb,dist:Math.hypot(de,dn)}},
tick(st,dt,ctx,force){let ch=false;
 if(st.fly||st.demo){const h=rad(st.hdg),v=22*dt;const ne=st.ae+Math.sin(h)*v,nn=st.an+Math.cos(h)*v;if(ne<0||ne>200||nn<0||nn>200){st.fly=false;st.demo=false}else{st.ae=ne;st.an=nn;ch=true}if(st.demo&&st.an>=180)st.demo=false}
 const tgt=st.loss?90:this.calc(st).rb;if(st.needle==null)st.needle=tgt;const d=sdiff(tgt,st.needle);
 if(Math.abs(d)>.05){st.needle=reduceMotion()?tgt:norm360(st.needle+d*(1-Math.exp(-9*dt)));ch=true}return ch},
drag(st,k,x,y){const e=clamp(x/1.6,0,200),n=clamp(200-y/1.6,0,200);if(k==='st'){st.se=Math.round(clamp(e,10,190));st.sn=Math.round(clamp(n,10,190))}else{st.ae=e;st.an=n}},
views:SV('adfmap','0 0 320 320','ADF map')+SV('adfdial','0 0 320 320','ADF indicator'),
legend:'<ul class="legend"><li>'+sw('#F8FAFC','3 4')+'Aircraft heading (nose direction)</li><li>'+sw('#2DD4BF','7 4')+'Bearing to the station</li><li>'+sw('#FBBF24')+'Relative bearing (arc)</li></ul><p class="cap">Left: map, north up. Drag the station or the aircraft with a mouse, or use the sliders. Right: ADF indicator, nose at the top.</p>',
draw(st,c,root){const X=e=>e*1.6,Y=n=>(200-n)*1.6,ax=X(st.ae),ay=Y(st.an),sx=X(st.se),sy=Y(st.sn);const N=st.needle==null?c.rb:st.needle;
 let m='';for(let g=0;g<=200;g+=40)m+=LN(X(g),0,X(g),320,'#1E4468',1)+LN(0,Y(g),320,Y(g),'#1E4468',1);
 m+=TX(300,18,'N ↑',{c:'#BAE6FD',s:14,w:700});
 m+='<g data-drag="st" style="cursor:grab"><circle cx="'+sx+'" cy="'+sy+'" r="22" fill="transparent"/><circle cx="'+sx+'" cy="'+sy+'" r="16" fill="none" stroke="#38BDF8" stroke-dasharray="3 4"/><circle cx="'+sx+'" cy="'+sy+'" r="26" fill="none" stroke="#38BDF8" stroke-opacity=".5" stroke-dasharray="3 4"/><path d="M'+sx+','+(sy-12)+' L'+(sx+9)+','+(sy+9)+' L'+(sx-9)+','+(sy+9)+'Z" fill="#FBBF24" stroke="#102A43"/>'+TX(sx,sy+26,'NDB station',{s:11})+'</g>';
 if(!st.loss)m+=LN(ax,ay,sx,sy,'#2DD4BF',2.5,'7 4');
 const hp=pol(ax,ay,62,st.hdg);m+=LN(ax,ay,hp[0],hp[1],'#F8FAFC',2,'3 4');
 if(!st.loss&&c.dist>8){const r=40,p1=pol(ax,ay,r,st.hdg),p2=pol(ax,ay,r,c.brg);m+='<path d="M'+p1[0]+','+p1[1]+' A'+r+','+r+' 0 '+(c.rb>180?1:0)+' 1 '+p2[0]+','+p2[1]+'" fill="none" stroke="#FBBF24" stroke-width="3"/>'}
 m+='<g data-drag="ac" style="cursor:grab" transform="translate('+ax+','+ay+') rotate('+st.hdg+')"><circle r="22" fill="transparent"/><path d="'+PLANE+'" fill="#F8FAFC" stroke="#102A43" stroke-width="1"/></g>'+TX(ax,ay+34,'HDG '+pad3(st.hdg),{s:11,c:'#F8FAFC'});
 setSvg(root,'adfmap',m,'Map view. Aircraft heading '+pad3(st.hdg)+'. The station is at bearing '+pad3(c.brg)+', distance '+f0(c.dist)+' units. '+(st.loss?'Signal lost.':''));
 let d='<circle cx="160" cy="160" r="140" fill="#0B2239" stroke="#38BDF8" stroke-width="3"/>';
 for(let a=0;a<360;a+=10){const maj=a%30===0,p1=pol(160,160,134,a),p2=pol(160,160,134-(maj?15:7),a);d+=LN(p1[0],p1[1],p2[0],p2[1],'#BAE6FD',maj?2.5:1.2);if(maj){const t=pol(160,160,104,a);d+=TX(t[0].toFixed(1),(t[1]+5).toFixed(1),a,{s:14})}}
 d+='<path d="M160,14 L151,-2 L169,-2Z" fill="#FBBF24" transform="translate(0,4)"/><path d="'+PLANE+'" transform="translate(160,160) scale(1.5)" fill="#7FA3C0" opacity=".8"/>';
 d+='<g transform="rotate('+N.toFixed(1)+' 160 160)" opacity="'+(st.loss?.55:1)+'"><line x1="160" y1="200" x2="160" y2="52" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"'+(st.loss?' stroke-dasharray="8 6"':'')+'/><polygon points="160,30 146,66 174,66" fill="#FBBF24" stroke="#102A43" stroke-width="2"/><line x1="160" y1="160" x2="160" y2="205" stroke="#38BDF8" stroke-width="6"/></g><circle cx="160" cy="160" r="8" fill="#102A43" stroke="#FBBF24" stroke-width="3"/>';
 d+=TX(160,316,'Needle shows relative bearing '+pad3(N),{s:13,w:700});
 if(st.loss)d+='<rect x="12" y="12" width="104" height="30" rx="6" fill="#FB7185"/>'+TX(64,32,'NO SIGNAL',{c:'#102A43',w:800,s:13});
 setSvg(root,'adfdial',d,'ADF indicator. Needle points to relative bearing '+pad3(N)+'. '+(st.loss?'No signal flag shown.':''))},
live(st,c){return{rows:[['Aircraft heading (HDG)',pad3(st.hdg)],['Relative bearing (RB)',st.loss?'not valid':pad3(c.rb)],['Bearing to the station',st.loss?'not valid':pad3(c.brg)],['Bearing from the station',st.loss?'not valid':pad3(c.brg+180)],['Distance (training units)',f0(c.dist)],['Signal',st.loss?'✗ LOST':'✓ received']],
 eq:st.loss?'':'Bearing to station = HDG + RB<br><b>'+pad3(st.hdg)+' + '+pad3(c.rb)+' = '+pad3(st.hdg+c.rb)+'</b>',
 msg:st.loss?'Signal lost: the needle is not valid. In real equipment the needle may park, drift or hold – it varies, so never trust it.':c.dist<8?'Station passage: the needle swings from ahead to behind and can be unsteady overhead.':''}},
tasks:[{t:'Turn the aircraft so the relative bearing is 090° (±3°) – the station off the right wingtip.',hint:'Change the heading slider and watch RB.',test:(s,c)=>!s.loss&&Math.abs(sdiff(c.rb,90))<=3},{t:'Make the needle point straight up (RB 000° ±3°). This is “homing” to the station.',hint:'Set heading equal to the bearing to the station.',test:(s,c)=>!s.loss&&Math.abs(sdiff(c.rb,0))<=3},{t:'Put the station directly behind the aircraft (RB 180° ±5°).',hint:'Turn the aircraft about 180° away from the station.',test:(s,c)=>!s.loss&&Math.abs(sdiff(c.rb,180))<=5}],
predict:{q:'The station is dead ahead (RB 000°). You turn the aircraft 30° to the right. What will the relative bearing read?',o:['030°','330°','000°','180°'],a:1,e:'Turning right swings the nose away from the station, so the station moves to the left of the nose: 360° − 30° = 330°.',hint:'Set the heading equal to the bearing to the station, then add 30° to the heading.'}};

/* ===================== VOR ===================== */
LABS.vor={title:'S08 · VOR Indication',sub:'Rotate the OBS, move the aircraft and read the CDI and TO/FROM flag.',simTitle:'VOR simulator',
concept:'<h2>Concept: invisible spokes from a station</h2><p><b>Plain English:</b> Picture a wheel with 360 spokes laid on the ground, with the VOR station at the hub. Each spoke has a number: its direction measured <i>away from</i> the hub. The cockpit indicator tells you which spoke you are on, and whether the spoke you selected is to your left or right.</p><div class="grid g2"><div class="card"><h3>Four different directions</h3><ul class="tight"><li><b>Radial</b> – the direction from the station out to the aircraft.</li><li><b>Selected course (OBS)</b> – the spoke you choose with the knob.</li><li><b>Heading</b> – where the nose points.</li><li><b>Bearing to the station</b> – the direction from the aircraft back to the station (radial ± 180°).</li></ul></div><div class="card"><h3>Reading the indicator</h3><ul class="tight"><li><b>CDI</b> needle: the selected course is to the left or right. Centred = on course.</li><li><b>TO/FROM</b>: would flying the selected course take you toward or away from the station?</li><li>Heading does <b>not</b> change the radial or the CDI.</li><li>Full-scale deflection is typically about ±10° (varies by equipment).</li></ul></div></div>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>What to remember</h3><ul class="tight"><li>The VOR receiver compares two signals from the station; the indicator shows the result.</li><li>An <b>OFF</b> flag means the indication is not reliable – it must never be hidden or disabled.</li><li>Faults can be in the antenna and cable, receiver, indicator, wiring or power.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Use approved test equipment and the approved AMM task for accuracy checks.</li><li>Record both indications when two systems disagree.</li><li>Never make adjustments or offsets without approved data.</li></ul></div></div><div class="notice">No VOR accuracy tolerances or adjustment values are given here. Use the approved manuals.</div>',
init:()=>({obs:90,hdg:90,ae:60,an:40,moving:false}),
controls(){const rm=reduceMotion();return [
 {t:'range',k:'obs',label:'OBS – selected course',min:0,max:359,step:1,fmt:v=>pad3(v)},
 {t:'range',k:'hdg',label:'Aircraft heading',min:0,max:359,step:1,fmt:v=>pad3(v)},
 {t:'range',k:'ae',label:'Aircraft position – east (+) / west (−)',min:-100,max:100,step:1,fmt:v=>Math.abs(f0(v))+' units '+(v>=0?'east':'west')},
 {t:'range',k:'an',label:'Aircraft position – north (+) / south (−)',min:-100,max:100,step:1,fmt:v=>Math.abs(f0(v))+' units '+(v>=0?'north':'south')},
 rm?{t:'btn',label:'Step aircraft forward 10 units',act:st=>{const h=rad(st.hdg);st.ae=clamp(st.ae+10*Math.sin(h),-100,100);st.an=clamp(st.an+10*Math.cos(h),-100,100)}}:{t:'toggle',k:'moving',label:'Aircraft flies along its heading'},
 {t:'btn',label:'Reset',act:st=>Object.assign(st,{obs:90,hdg:90,ae:60,an:40,moving:false})}]},
calc(st){const R=norm360(deg(Math.atan2(st.ae,st.an))),dist=Math.hypot(st.ae,st.an),d=sdiff(R,st.obs),ad=Math.abs(d);let flag=ad<=90?'FROM':'TO';const off=(ad>=85&&ad<=95)||dist<6;
 const rr=ad<=90?st.obs:norm360(st.obs+180),e=sdiff(R,rr),needle=ad<=90?-e:e,dev=clamp(needle,-10,10);return{R,dist,btn:norm360(R+180),flag:off?'OFF':flag,off,needle,dev}},
tick(st,dt){if(!st.moving)return false;const h=rad(st.hdg),v=14*dt,ne=st.ae+Math.sin(h)*v,nn=st.an+Math.cos(h)*v;if(Math.abs(ne)>100||Math.abs(nn)>100){st.moving=false;return true}st.ae=ne;st.an=nn;return true},
drag(st,k,x,y){st.ae=Math.round(clamp((x-160)/1.5,-100,100));st.an=Math.round(clamp((160-y)/1.5,-100,100))},
views:SV('vormap','0 0 320 320','VOR map')+SV('vorcdi','0 0 320 320','VOR indicator'),
legend:'<ul class="legend"><li>'+sw('#38BDF8','8 5')+'Aircraft radial (from station)</li><li>'+sw('#FBBF24')+'Selected course (OBS)</li><li>'+sw('#F8FAFC')+'Heading arrow</li><li>'+sw('#2DD4BF','2 4')+'Bearing to station arrow</li></ul><p class="cap">Left: map, north up, VOR station at the centre. Drag the aircraft with a mouse or use sliders. Right: VOR indicator (OBS course at the top).</p>',
draw(st,c,root){const cx=160,cy=160,K=1.5,ax=cx+st.ae*K,ay=cy-st.an*K;let m='';
 for(let a=0;a<360;a+=30){const p=pol(cx,cy,150,a),t=pol(cx,cy,138,a);m+=LN(cx,cy,p[0],p[1],'#1E4468',1);m+=TX(t[0].toFixed(0),(t[1]+4).toFixed(0),String(a).padStart(3,'0'),{s:10,c:'#7FB4D6'})}
 m+='<circle cx="160" cy="160" r="75" fill="none" stroke="#1E4468"/>';
 const c1=pol(cx,cy,142,st.obs),c2=pol(cx,cy,142,st.obs+180);m+=LN(cx,cy,c2[0],c2[1],'#FBBF24',2,'3 5')+arrow(cx,cy,c1[0],c1[1],'#FBBF24',4);
 m+=LN(cx,cy,ax,ay,'#38BDF8',3,'8 5');
 m+='<polygon points="160,148 171,154 171,166 160,172 149,166 149,154" fill="#FBBF24" stroke="#102A43" stroke-width="2"/>'+TX(160,190,'VOR',{s:11,w:700});
 const bu=pol(ax,ay,16,c.btn),bv=pol(ax,ay,50,c.btn),sh=pol(ax,ay,7,c.btn+90);if(c.dist>14)m+=arrow(bu[0]+sh[0]-ax,bu[1]+sh[1]-ay,bv[0]+sh[0]-ax,bv[1]+sh[1]-ay,'#2DD4BF',3,'2 4');
 const hp=pol(ax,ay,58,st.hdg);m+=arrow(ax,ay,hp[0],hp[1],'#F8FAFC',2.5);
 m+='<g data-drag="ac" style="cursor:grab" transform="translate('+ax.toFixed(1)+','+ay.toFixed(1)+') rotate('+st.hdg+')"><circle r="22" fill="transparent"/><path d="'+PLANE+'" fill="#F8FAFC" stroke="#102A43" stroke-width="1"/></g>';
 setSvg(root,'vormap',m,'Map. Aircraft is on the '+pad3(c.R)+' radial, '+f0(c.dist)+' units from the station. OBS course '+pad3(st.obs)+', heading '+pad3(st.hdg)+', bearing to the station '+pad3(c.btn)+'.');
 let d='<circle cx="160" cy="154" r="134" fill="#0B2239" stroke="#38BDF8" stroke-width="3"/><g transform="rotate('+(-st.obs)+' 160 154)">';
 for(let a=0;a<360;a+=10){const maj=a%30===0,p1=pol(160,154,130,a),p2=pol(160,154,130-(maj?13:6),a);d+=LN(p1[0],p1[1],p2[0],p2[1],'#BAE6FD',maj?2.5:1.2);if(maj){const t=pol(160,154,106,a);d+='<g transform="rotate('+st.obs+' '+t[0].toFixed(1)+' '+(t[1]+4).toFixed(1)+')">'+TX(t[0].toFixed(1),(t[1]+4).toFixed(1),a/10,{s:13})+'</g>'}}
 d+='</g><path d="M160,22 L150,6 L170,6Z" fill="#FBBF24"/>';
 [-80,-40,40,80].forEach(x=>d+='<circle cx="'+(160+x)+'" cy="154" r="5" fill="none" stroke="#BAE6FD" stroke-width="2"/>');
 d+='<path d="'+PLANE+'" transform="translate(160,194) scale(.9)" fill="#7FA3C0"/>';
 const cdx=160+c.dev/10*80;d+='<line x1="'+cdx+'" y1="64" x2="'+cdx+'" y2="244" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>'+LN(160,60,160,64,'#F8FAFC',1);
 if(c.flag==='TO')d+='<polygon points="160,92 144,118 176,118" fill="#2DD4BF" stroke="#102A43" stroke-width="2"/>'+TX(200,112,'TO',{s:16,w:800,c:'#2DD4BF'});
 else if(c.flag==='FROM')d+='<polygon points="160,228 144,202 176,202" fill="#2DD4BF" stroke="#102A43" stroke-width="2"/>'+TX(205,228,'FROM',{s:16,w:800,c:'#2DD4BF'});
 else d+='<rect x="40" y="52" width="86" height="30" rx="6" fill="#FB7185"/>'+TX(83,72,'OFF flag',{c:'#102A43',w:800,s:15});
 d+=TX(160,314,'OBS '+pad3(st.obs)+' · '+c.flag,{s:14,w:700});
 setSvg(root,'vorcdi',d,'VOR indicator. OBS '+pad3(st.obs)+'. Flag shows '+c.flag+'. CDI '+(Math.abs(c.dev)<.5?'centred':f1(Math.abs(c.dev))+' degrees '+(c.dev<0?'left':'right'))+'.')},
live(st,c){const side=Math.abs(c.dev)<.5?'Centred (on course)':'Course is '+f1(Math.abs(c.needle))+'° to your '+(c.dev<0?'LEFT':'RIGHT')+(Math.abs(c.needle)>10?' (full scale)':'');
 return{rows:[['OBS selected course',pad3(st.obs)],['Aircraft radial (from station)',pad3(c.R)],['Bearing to the station',pad3(c.btn)],['Aircraft heading',pad3(st.hdg)],['TO / FROM',c.flag],['CDI',side],['Distance (units)',f0(c.dist)]],
 eq:'Bearing to station = radial ± 180°<br><b>'+pad3(c.R)+' → '+pad3(c.btn)+'</b>',msg:c.off?'OFF: about 90° from the selected radial or too close to the station. The indication is not usable.':'Try changing the heading: the radial, TO/FROM and CDI do not change.'}},
tasks:[{t:'Centre the CDI (within 1°) with a FROM indication.',hint:'Move the aircraft onto the selected radial, or turn the OBS to the aircraft’s radial.',test:(s,c)=>c.flag==='FROM'&&Math.abs(c.needle)<1},{t:'Centre the CDI with a TO indication.',hint:'Set the OBS to the bearing to the station (radial + 180°).',test:(s,c)=>c.flag==='TO'&&Math.abs(c.needle)<1},{t:'Put the aircraft on the 180 radial (±3°), more than 40 units from the station.',hint:'Move it directly south of the station.',test:(s,c)=>Math.abs(sdiff(c.R,180))<=3&&c.dist>40}],
predict:{q:'The aircraft is due east of the station (090 radial), OBS is 090, and heading is 270°. What does TO/FROM show?',o:['TO','FROM','OFF','It depends on the heading'],a:1,e:'The aircraft is on the 090 radial and the OBS is 090, so flying that course takes it away from the station: FROM. Heading does not matter.',hint:'Set east 60, north 0, OBS 090 and heading 270. Then change the heading.'}};

/* ===================== PULSE ===================== */
const CKM=0.3; /* km per microsecond, training value */
LABS.pulse={title:'S10 · Pulse Radar',sub:'Send a pulse, time the echo and calculate range.',simTitle:'Pulse radar simulator',playable:true,stepDt:.2,
concept:'<h2>Concept: shout and listen for the echo</h2><p><b>Plain English:</b> Shout in a canyon and time how long the echo takes to come back. Longer wait = farther wall. A pulse radar does this with radio waves, which travel at the speed of light.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li>Radio waves travel about 0.3 km every microsecond (µs).</li><li><b>Range = c × t ÷ 2</b></li><li><b>Why ÷2?</b> The measured time covers the trip out <i>and</i> back. The target is only half-way.</li><li><b>PRF</b>: pulses per second. The time between pulses is 1 ÷ PRF.</li><li><b>Pulse width</b>: a longer pulse gives coarser range resolution (≈ c × width ÷ 2).</li></ul></div><div class="card"><h3>Limits to know</h3><ul class="tight"><li><b>Maximum unambiguous range</b> ≈ c ÷ (2 × PRF). Higher PRF = shorter limit.</li><li>A target beyond this can appear at the <b>wrong, nearer range</b>.</li><li>Very close targets may be missed while the radar is still transmitting.</li><li>Two close targets within one pulse-length merge into one echo.</li></ul></div></div><p class="formula">Range = (speed of light × echo time) ÷ 2</p><p class="foot">Training value: c ≈ 0.3 km/µs. All numbers are illustrative.</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>What matters on the aircraft</h3><ul class="tight"><li>Transmitter, antenna, receiver and processor must work together; timing errors become range errors.</li><li>PRF, pulse width and range settings are normally set by the system – not by technicians in the field.</li><li>Radiating radar on the ground can be hazardous: follow approved safety instructions.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Use approved ground-test procedures and hazard-area controls.</li><li>Never defeat interlocks or inhibits.</li></ul></div></div><div class="notice">No real PRF, pulse width or power figures are provided. They are system specific and found in approved data.</div>',
init:()=>({range:120,pw:2,prf:1000,two:false,sep:.5,p:0}),
controls:()=>[{t:'range',k:'range',label:'Target range',min:5,max:300,step:1,fmt:v=>v+' km'},{t:'range',k:'pw',label:'Pulse width',min:.2,max:10,step:.1,fmt:v=>f1(v)+' µs'},{t:'range',k:'prf',label:'Pulse repetition frequency (PRF)',min:200,max:4000,step:50,fmt:v=>v+' Hz'},{t:'toggle',k:'two',label:'Add a second target behind the first'},{t:'range',k:'sep',label:'Spacing to second target',min:.1,max:5,step:.1,fmt:v=>f1(v)+' km',show:s=>s.two}],

legend:'<ul class="legend"><li>'+sw('#38BDF8')+'Outbound pulse</li><li>'+sw('#2DD4BF','2 4')+'Returning echo</li><li>'+sw('#FBBF24')+'Transmit pulse on display</li></ul><p class="cap">Top: the real scene (slow motion). Bottom: what the radar display shows.</p>',

 let s=LN(x0,yy+26,380,yy+26,'#1E4468',1);for(let k=0;k<=300;k+=50)s+=LN(x0+k*sc,yy+22,x0+k*sc,yy+30,'#7FB4D6',1)+TX(x0+k*sc,yy+43,k,{s:10,c:'#7FB4D6'});s+=TX(390,yy+56,'km',{s:10,c:'#7FB4D6',a:'end'});
 s+='<path d="M18,70 Q40,88 18,106" fill="none" stroke="#FBBF24" stroke-width="4"/><rect x="8" y="84" width="10" height="8" fill="#FBBF24"/>'+TX(30,64,'Radar',{s:11});
 const tx=x0+st.range*sc;s+='<g transform="translate('+tx+','+yy+') rotate(-90) scale(.9)"><path d="'+PLANE+'" fill="#F8FAFC"/></g>'+TX(tx,yy-26,'Target '+st.range+' km',{s:11});
 if(st.two){const t2=x0+(st.range+st.sep)*sc;s+='<g transform="translate('+Math.min(t2,385)+','+(yy-34)+') rotate(-90) scale(.6)"><path d="'+PLANE+'" fill="#94A3B8"/></g>'}
 if(c.Rmax<300)s+=LN(x0+c.Rmax*sc,28,x0+c.Rmax*sc,yy+20,'#FB7185',2,'5 4')+TX(x0+c.Rmax*sc,22,'Max unambiguous '+f0(c.Rmax)+' km',{s:10,c:'#FDA4AF'});
 if(q<1||st.p<1.25){const col=out?'#38BDF8':'#2DD4BF';s+='<rect x="'+(px-w/2)+'" y="'+(yy-14)+'" width="'+w+'" height="28" rx="6" fill="'+col+'" fill-opacity=".85" stroke="#F8FAFC" stroke-width="1.5"'+(out?'':' stroke-dasharray="3 2"')+'/>'+arrow(px+(out?w/2:-w/2),yy,px+(out?w/2+16:-w/2-16),yy,'#F8FAFC',2.5)}
 s+=TX(200,160,'Timer: '+f0(q*c.tRT)+' µs of '+f0(c.tRT)+' µs round trip',{s:12,c:'#BAE6FD'});
 setSvg(root,'pscene',s,'Pulse radar scene. Target at '+st.range+' kilometres. Round-trip echo time '+f0(c.tRT)+' microseconds.');
 const ax=30,aw=350,y0=130,xs=km=>ax+km/c.Rmax*aw;let d=LN(ax,y0,ax+aw,y0,'#BAE6FD',2);[0,.5,1].forEach(f=>{d+=LN(ax+f*aw,y0,ax+f*aw,y0+7,'#BAE6FD',1.5)+TX(ax+f*aw,y0+20,f0(f*c.Rmax)+' km',{s:11})});
 d+='<rect x="'+ax+'" y="40" width="'+Math.max(4,c.res/c.Rmax*aw)+'" height="90" fill="#FBBF24"/>'+TX(ax+6,34,'Transmit pulse',{a:'start',s:11,c:'#FBBF24'});
 const op=st.p>=1?1:.35;
 if(c.tooClose)d+=TX(210,75,'Target inside minimum range –',{s:12,c:'#FDA4AF'})+TX(210,91,'hidden by the transmit pulse',{s:12,c:'#FDA4AF'});
 else{const e1=xs(c.app),wd=Math.max(4,c.res/c.Rmax*aw);if(st.two&&!c.resolved){d+='<rect x="'+e1+'" y="60" width="'+(wd+Math.max(0,xs(c.app2)-e1))+'" height="70" fill="#2DD4BF" fill-opacity="'+op+'" stroke="#2DD4BF" stroke-dasharray="3 2"/>'+TX(e1+8,54,'merged echoes',{s:11,c:'#2DD4BF',a:'start'})}
  else{d+='<rect x="'+e1+'" y="60" width="'+wd+'" height="70" fill="#2DD4BF" fill-opacity="'+op+'" stroke="#2DD4BF"/>'+TX(e1,54,'echo 1',{s:11,c:'#2DD4BF'});if(st.two)d+='<rect x="'+xs(c.app2)+'" y="75" width="'+wd+'" height="55" fill="#2DD4BF" fill-opacity="'+op+'" stroke="#2DD4BF" stroke-dasharray="3 2"/>'+TX(xs(c.app2),69,'echo 2',{s:11,c:'#2DD4BF'})}}
 d+=TX(200,160,'Display axis: 0 to maximum unambiguous range',{s:10,c:'#7FB4D6'});
 setSvg(root,'pscope',d,'Echo display. Echo shown at '+f0(c.app)+' kilometres'+(c.amb?' (ambiguous – true range is '+st.range+' km)':'')+'.')},
live(st,c){const t=c.tShown,trav=CKM*t;return{rows:[['Target range (true)',st.range+' km'],['Echo time read by radar',f0(t)+' µs'],['Distance pulse travelled (c × t)',f0(trav)+' km'],['Range shown = travelled ÷ 2',f0(trav/2)+' km'],['Time between pulses (PRT)',f0(c.PRT)+' µs'],['Max unambiguous range',f0(c.Rmax)+' km'],['Range resolution (c × width ÷ 2)',f0(c.res*1000)+' m']],

 msg:c.tooClose?'Target is closer than the minimum range for this pulse width: it may not be seen.':c.amb?'Range ambiguity! The true range is '+st.range+' km but the echo is read at '+f0(c.app)+' km. Lower the PRF to fix it.':st.two&&!c.resolved?'The two targets are closer than the range resolution, so their echoes merge. Reduce the pulse width.':''}},

/* ===================== CW ===================== */
LABS.cw={title:'S11 · Continuous-Wave Radar',sub:'A steady signal reveals speed through the Doppler effect – but not range.',simTitle:'CW radar simulator',playable:true,stepDt:.3,
concept:'<h2>Concept: a steady tone and its change</h2><p><b>Plain English:</b> A radar that never stops transmitting is like a steady musical note. If the echo comes back from something moving, the note sounds slightly higher (closing) or lower (opening) – like an ambulance siren passing you.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li><b>Continuous wave (CW)</b>: constant, unmodulated transmission.</li><li>The <b>Doppler shift</b> gives <b>radial speed</b>: fd = 2 × v × f ÷ c.</li><li>Closing = frequency goes up; opening = frequency goes down.</li><li>No radial movement = no shift.</li></ul></div><div class="card"><h3>Important limit</h3><ul class="tight"><li><b>Basic unmodulated CW radar does not directly measure range.</b> The steady signal has no timing mark.</li><li>Moving the target farther away does not change the Doppler shift.</li><li>Simple receivers may show only the size of the shift; telling closing from opening needs extra processing.</li><li>Transmit and receive must be kept separate because the radar transmits all the time.</li></ul></div></div><p class="formula">Doppler shift = 2 × radial speed × transmit frequency ÷ c</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>Why it matters</h3><ul class="tight"><li>CW-type sensors give speed information only; do not expect a range output.</li><li>Isolation between transmit and receive paths and clean cabling matter for quality of the output.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Use the approved system description to know what outputs to expect.</li><li>“No range” on a CW sensor is not a fault.</li></ul></div></div><div class="notice">Transmit frequency in this simulator is illustrative only and not taken from any aircraft system.</div>',
init:()=>({v:80,fc:10,dist:40,ph:0}),
controls:()=>[{t:'range',k:'v',label:'Radial target speed (+ closing / − opening)',min:-250,max:250,step:5,fmt:v=>(v>0?'+':'')+v+' m/s'},{t:'range',k:'fc',label:'Transmit frequency (illustrative)',min:1,max:40,step:1,fmt:v=>v+' GHz'},{t:'range',k:'dist',label:'Target distance (changes nothing in CW!)',min:5,max:200,step:5,fmt:v=>v+' km'}],
calc(st){return{fd:2*st.v*st.fc*1e9/3e8,state:Math.abs(st.v)<1?'zero':st.v>0?'closing':'opening'}},
tick(st,dt,ctx,force){if(!ctx.playing&&!force)return false;st.ph=(st.ph+(force?4:dt*40))%1000;return true},
views:SV('cwscene','0 0 400 190','CW radar scene')+SV('cwspec','0 0 400 170','Frequency display'),
legend:'<ul class="legend"><li>'+sw('#38BDF8')+'Transmitted wave</li><li>'+sw('#2DD4BF','6 3')+'Echo</li></ul><p class="cap">Wave spacing is exaggerated to make the Doppler effect visible.</p>',
draw(st,c,root){const tx=150+(st.dist/200)*190,lam=20,lr=clamp(lam*(1-.5*st.v/250),9,34);let s='<path d="M18,70 Q40,95 18,120" fill="none" stroke="#FBBF24" stroke-width="4"/>'+TX(30,138,'Radar',{s:11});
 let p1='M44,50',p2='M44,128';for(let x=44;x<=tx-24;x+=2){p1+=' L'+x+','+(50+11*Math.sin(2*Math.PI*(x-st.ph)/lam)).toFixed(1);p2+=' L'+x+','+(128+11*Math.sin(2*Math.PI*(x+st.ph)/lr)).toFixed(1)}
 s+='<path d="'+p1+'" fill="none" stroke="#38BDF8" stroke-width="2.5"/><path d="'+p2+'" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="6 3"/>'+TX(46,28,'Transmitted: continuous, unchanged',{a:'start',s:11})+TX(46,160,'Echo: '+(c.state==='closing'?'waves squeezed (higher frequency)':c.state==='opening'?'waves stretched (lower frequency)':'same spacing (no shift)'),{a:'start',s:11,c:'#2DD4BF'});
 s+='<g transform="translate('+tx+',90) rotate(-90) scale(1.1)"><path d="'+PLANE+'" fill="#F8FAFC"/></g>';
 if(c.state==='closing')s+=arrow(tx+10,76,tx-30,76,'#FBBF24',3)+TX(tx,70,'closing',{s:11,c:'#FBBF24'});else if(c.state==='opening')s+=arrow(tx-10,76,tx+30,76,'#FBBF24',3)+TX(tx+10,70,'opening',{s:11,c:'#FBBF24'});else s+=TX(tx,70,'no radial motion',{s:11,c:'#FBBF24'});
 setSvg(root,'cwscene',s,'Radar sends a continuous wave; the target is '+st.dist+' kilometres away, '+c.state+' at '+Math.abs(st.v)+' metres per second.');
 const cx=205,rx=cx+150*st.v/250;let f=LN(30,120,380,120,'#BAE6FD',2)+TX(205,150,'Frequency →',{s:11,c:'#BAE6FD'});
 f+='<rect x="'+(cx-5)+'" y="40" width="10" height="80" fill="#38BDF8"/>'+TX(cx,34,'Transmitted',{s:11,c:'#38BDF8'});
 if(Math.abs(st.v)>=1){f+='<rect x="'+(rx-5)+'" y="62" width="10" height="58" fill="#2DD4BF" stroke="#102A43"/>'+TX(rx,56,'Echo',{s:11,c:'#2DD4BF'})+arrow(cx+(st.v>0?12:-12),100,rx-(st.v>0?-1:1)*8,100,'#FBBF24',3)}
 else f+=TX(cx+30,90,'Echo at same frequency',{s:11,c:'#2DD4BF',a:'start'});
 f+=TX(205,20,'Doppler shift ≈ '+(c.fd>=0?'+':'−')+fmtHz(Math.abs(c.fd))+' (gap not to scale)',{s:12,w:700});
 setSvg(root,'cwspec',f,'Frequency display. Doppler shift '+f0(c.fd)+' hertz, target '+c.state+'.')},
live(st,c){return{rows:[['Radial speed',(st.v>0?'+':'')+st.v+' m/s ('+f0(Math.abs(st.v)*3.6)+' km/h)'],['Direction',c.state==='zero'?'None':c.state],['Transmit frequency (illustrative)',st.fc+' GHz'],['Doppler shift',(c.fd>=0?'+':'−')+fmtHz(Math.abs(c.fd))],['Speed recovered from shift',f0(c.fd*3e8/(2*st.fc*1e9))+' m/s'],['Range','Not measured by basic CW'],['Target distance (set)',st.dist+' km – no effect']],
 eq:'Doppler shift = 2 × v × f ÷ c<br>= 2 × '+st.v+' × '+st.fc+' GHz ÷ c = <b>'+fmtHz(Math.abs(c.fd))+'</b>',msg:'Basic unmodulated CW radar does not directly measure range. Move the distance slider: the Doppler shift does not change.'}},
tasks:[{t:'Show a closing speed of at least 150 m/s.',hint:'Slide the speed to the right.',test:s=>s.v>=150},{t:'Show an opening target (speed below −50 m/s).',hint:'Slide the speed to the left.',test:s=>s.v<=-50},{t:'Show what the radar sees when there is no radial motion.',hint:'Set the speed to 0.',test:s=>Math.abs(s.v)<2}],
predict:{q:'You double the target distance but keep its speed the same. What happens to the CW Doppler shift?',o:['It doubles','It halves','It stays the same','It becomes zero'],a:2,e:'Doppler shift depends on radial speed (and frequency), not distance. Basic CW cannot measure range.',hint:'Change the distance slider while watching the Doppler shift.'}};

/* ===================== DOPPLER ===================== */
LABS.dop={title:'S12 · Doppler Effect',sub:'Change speed and direction to see closing, opening and zero radial velocity.',simTitle:'Doppler simulator',
concept:'<h2>Concept: only the “toward or away” part counts</h2><p><b>Plain English:</b> Doppler cares only about how fast something moves <i>along the line between you and it</i>. A car driving straight at you has a strong shift. A car circling around you at the same distance has almost none.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li><b>Radial velocity</b> = speed × cos(angle to the line of sight).</li><li><b>Closing</b> → frequency up. <b>Opening</b> → frequency down. <b>Perpendicular</b> → little or no shift.</li><li>fd = 2 × radial velocity × f ÷ c. The factor 2 appears because the wave is shifted on the way out and again on the way back.</li></ul></div><div class="card"><h3>Remember</h3><ul class="tight"><li>A fast target moving across the beam can still show almost no Doppler.</li><li>The tangential (sideways) part of the velocity is invisible to Doppler.</li><li>Real targets are rarely perfectly perpendicular, so some radial component usually exists.</li></ul></div></div><p class="formula">Radial velocity = speed × cos θ</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>Why it matters</h3><ul class="tight"><li>Doppler displays can show “zero” motion for targets crossing the beam – this is physics, not a fault.</li><li>Understanding radial velocity helps you separate system behaviour from real faults.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>When a crew reports “missing” motion data, compare the geometry to the approved system description first.</li></ul></div></div>',
init:()=>({v:150,th:0,fc:10}),
controls:()=>[{t:'range',k:'v',label:'Target speed',min:0,max:300,step:5,fmt:v=>v+' m/s'},{t:'range',k:'th',label:'Angle between movement and line of sight (0° = straight at radar)',min:-180,max:180,step:5,fmt:v=>(v>0?'+':'')+v+'°'},{t:'btn',label:'Preset: head-on (0°)',act:s=>s.th=0},{t:'btn',label:'Preset: crossing (90°)',act:s=>s.th=90},{t:'btn',label:'Preset: moving away (180°)',act:s=>s.th=180}],
calc(st){const vr=st.v*Math.cos(rad(st.th)),vt=Math.abs(st.v*Math.sin(rad(st.th)));return{vr,vt,state:Math.abs(vr)<1?'zero':vr>0?'closing':'opening',fd:2*vr*st.fc*1e9/3e8}},
views:SV('dscene','0 0 400 250','Doppler geometry'),
legend:'<ul class="legend"><li>'+sw('#F8FAFC')+'Actual velocity</li><li>'+sw('#2DD4BF')+'Radial part (what Doppler senses)</li><li>'+sw('#FBBF24','5 4')+'Sideways part (invisible to Doppler)</li></ul>',
draw(st,c,root){const T=[300,110],k=.3,dir=[-Math.cos(rad(st.th)),-Math.sin(rad(st.th))],V=[T[0]+k*st.v*dir[0],T[1]+k*st.v*dir[1]],P=[V[0],T[1]];
 let s='<path d="M34,88 Q58,110 34,132" fill="none" stroke="#FBBF24" stroke-width="4"/>'+TX(50,150,'Radar',{s:11})+LN(50,110,T[0],T[1],'#4B7BA3',1.5,'4 4')+TX(175,102,'line of sight',{s:11,c:'#7FB4D6'});
 s+='<g transform="translate('+T[0]+','+T[1]+') rotate(-90) scale(1)"><path d="'+PLANE+'" fill="#CBD5E1" opacity=".9"/></g>';
 if(st.v>0){if(Math.abs(P[0]-T[0])>2)s+=arrow(T[0],T[1],P[0],P[1],'#2DD4BF',5);if(c.vt>1)s+=arrow(P[0],P[1],V[0],V[1],'#FBBF24',3,'6 4');s+=arrow(T[0],T[1],V[0],V[1],'#F8FAFC',2.5);
  const a=Math.min(Math.abs(st.th),180);if(a>3&&a<=180){const r=34,p1=[T[0]-r,T[1]],p2=[T[0]+r*dir[0],T[1]+r*dir[1]];s+='<path d="M'+p1[0]+','+p1[1]+' A'+r+','+r+' 0 0 '+(st.th>0?1:0)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1)+'" fill="none" stroke="#BAE6FD"/>'+TX(T[0]-48,T[1]-(st.th>0?12:-20),'θ = '+Math.abs(st.th)+'°',{s:11,c:'#BAE6FD'})}}
 const badge=c.state==='closing'?'CLOSING  ↑ frequency':c.state==='opening'?'OPENING  ↓ frequency':'ZERO RADIAL VELOCITY';s+=TX(200,24,badge,{s:15,w:800,c:c.state==='zero'?'#FBBF24':'#2DD4BF'});
 const mx=200,half=130,fill=clamp(c.vr/300,-1,1)*half;s+=LN(mx-half,214,mx+half,214,'#BAE6FD',2)+LN(mx,206,mx,222,'#F8FAFC',2)+'<rect x="'+Math.min(mx,mx+fill)+'" y="208" width="'+Math.abs(fill)+'" height="12" fill="#2DD4BF"/>'+TX(mx-half,238,'opening (lower f)',{s:10,c:'#BAE6FD',a:'start'})+TX(mx+half,238,'closing (higher f)',{s:10,c:'#BAE6FD',a:'end'})+TX(mx,200,'Radial velocity meter',{s:10,c:'#BAE6FD'});
 setSvg(root,'dscene',s,'Geometry: target speed '+st.v+' metres per second at '+st.th+' degrees to the line of sight. Radial velocity '+f0(c.vr)+' metres per second, '+c.state+'.')},
live(st,c){return{rows:[['Target speed',st.v+' m/s'],['Angle θ',st.th+'°'],['Radial velocity',(Math.abs(c.vr)<.5?'0':(c.vr>=0?'+':'−')+f0(Math.abs(c.vr)))+' m/s'],['Sideways (tangential)',f0(c.vt)+' m/s'],['Status',c.state==='zero'?'ZERO radial velocity':c.state.toUpperCase()],['Doppler shift (10 GHz, illustr.)',(c.fd>=0?'+':'−')+fmtHz(Math.abs(c.fd))]],eq:'Radial = '+st.v+' × cos('+st.th+'°) = <b>'+f0(c.vr)+' m/s</b>',msg:c.state==='zero'&&st.v>0?'The target is moving fast but exactly across the line of sight, so Doppler sees almost nothing.':''}},
tasks:[{t:'Show zero radial velocity while the target moves faster than 100 m/s.',hint:'Set the angle to 90°.',test:(s,c)=>s.v>100&&Math.abs(c.vr)<5},{t:'Show an opening target (radial velocity below −50 m/s).',hint:'Turn the angle beyond 90°.',test:(s,c)=>c.vr<-50},{t:'Get a closing radial velocity of about 100 m/s (90–110) from a 200 m/s target.',hint:'200 × cos θ = 100.',test:(s,c)=>s.v>=190&&s.v<=210&&c.vr>=90&&c.vr<=110}],
predict:{q:'A target moves at 200 m/s at 60° to the line of sight (towards the radar). What is its radial speed?',o:['200 m/s','100 m/s','173 m/s','0 m/s'],a:1,e:'200 × cos 60° = 100 m/s.',hint:'Set speed 200 and angle 60°.'}};

/* ===================== FMCW ===================== */
LABS.fmcw={title:'S13 · FMCW Radar',sub:'Compare the sent and returning frequency sweeps and read range from the beat frequency.',simTitle:'FMCW simulator',
concept:'<h2>Concept: a rising whoop instead of a short pulse</h2><p><b>Plain English:</b> Imagine sending a tone that rises steadily in pitch. The echo comes back late, so when it arrives the radar is already sending a higher pitch. The <i>difference</i> between the pitch being sent now and the pitch returning is the <b>beat frequency</b>. Farther target → longer delay → bigger beat.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li>The radar transmits continuously and sweeps its frequency (a <b>chirp</b>).</li><li><b>Beat frequency</b> fb = 2 × R × B ÷ (c × T) where B = sweep bandwidth, T = sweep time.</li><li>Range from beat: R = c × T × fb ÷ (2 × B).</li><li><b>Range resolution</b> ≈ c ÷ (2 × B): wider sweep = finer resolution.</li></ul></div><div class="card"><h3>Advanced view</h3><ul class="tight"><li>A triangle sweep (up then down) separates range from motion.</li><li>Closing motion lowers the up-sweep beat and raises the down-sweep beat.</li><li>Average of the two → range. Difference → radial speed.</li></ul></div></div><p class="formula">Beat frequency = frequency difference between sent and received sweep</p><p class="foot">The delay between sweeps is exaggerated in the drawing. All numbers are illustrative; 10 GHz is used for the advanced speed example only.</p>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>Why it matters</h3><ul class="tight"><li>FMCW techniques appear in some short-range sensors and radio-altimeter-type systems.</li><li>Nearby metal and reflections can create extra beat frequencies, so test conditions matter.</li><li>Antenna cabling, connectors and bonding affect signal quality.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Follow approved test set-ups for height-sensing equipment.</li><li>Do not change calibration or configuration data without approved data.</li></ul></div></div>',
init:()=>({R:300,B:150,T:1,view:'basic',vel:0}),

 const cyc=1+11*Math.log(1+c.fr/1e4)/Math.log(1+6700);let w='<line x1="20" y1="50" x2="380" y2="50" stroke="#1E4468"/>';let pth='';for(let x=20;x<=380;x+=1)pth+=(pth?' L':'M')+x+','+(50+30*Math.sin(2*Math.PI*cyc*(x-20)/360)).toFixed(1);

const CELLS=[{n:'A',r:45,az:-25,s:6,p:.55,top:25},{n:'B',r:80,az:10,s:9,p:1,top:40},{n:'C',r:125,az:11,s:9,p:.9,top:38},{n:'D',r:70,az:45,s:7,p:.35,top:18},{n:'E',r:150,az:-30,s:12,p:.6,top:30}];

const lvl=i=>i<.15?0:i<.4?1:i<.65?2:3;
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967295}
LABS.wx={title:'S14 · Weather Radar',sub:'Pulse-Doppler principles on a simplified sector display. Adjust range and tilt.',simTitle:'Weather radar simulator',
concept:'<h2>Concept: a radar that “sees” raindrops</h2><p><b>Plain English:</b> Raindrops and ice reflect a little radio energy. The weather radar sweeps a beam left and right, times each echo (pulse radar) and colours the display by how strong the echo is. Stronger echo ≈ heavier precipitation.</p><div class="grid g2"><div class="card"><h3>Key ideas</h3><ul class="tight"><li><b>Pulses</b> give range; the scanning <b>antenna</b> gives direction.</li><li><b>Doppler</b> processing can add motion information, such as turbulent motion in some systems.</li><li><b>Tilt</b> points the beam up or down. Too low → <b>ground clutter</b>. Too high → the beam overshoots low weather.</li><li>The display shows where precipitation is <b>now</b>, not a forecast.</li></ul></div><div class="card"><h3>Display limits</h3><ul class="tight"><li><b>Attenuation:</b> heavy precipitation weakens the signal.</li><li><b>Shadow:</b> weather behind a strong cell can be hidden or look weaker.</li><li><b>Colours, labels and controls vary by equipment.</b> Check the approved documents for your system.</li></ul></div></div><div class="notice bad"><strong>Safety:</strong> this screen teaches how to read the display. It does not teach flying through hazardous weather. Weather avoidance follows approved operator procedures and flight crew decisions. Never transmit radar on the ground without approved safety conditions.</div>',
tech:'<h2>Technician view</h2><div class="grid g2"><div class="card"><h3>What a technician should know</h3><ul class="tight"><li>Ground returns on the display after a tilt change are normal – check settings before suspecting hardware.</li><li>A blank area behind a heavy cell may be an attenuation shadow, not a fault.</li><li>Real faults come from the antenna and mount, waveguide or cable, transmitter/receiver, control panel, display or power.</li></ul></div><div class="card"><h3>Safe habits</h3><ul class="tight"><li>Respect radiation hazard areas and ground-transmit inhibits.</li><li>Never tell crew that a blank region is safe weather.</li><li>Use approved data for any test and alignment.</li></ul></div></div><div class="notice">Colours and values on this display are illustrative and do not match any specific equipment.</div>',
init:()=>({rng:100,tilt:-4,alt:30,att:false,clut:true,dop:false}),

calc(st){const AZ=121,RB=200,rng=st.rng,dr=rng/RB,H=st.alt*1000,K=.03;const L=[],TL=[];let shadow=0,maxL=0;
 const frac=(r,top)=>{r=Math.max(r,1);const ce=H+r*NMFT*Math.tan(rad(st.tilt)),hb=r*NMFT*Math.tan(rad(BW/2)),lo=ce-hb,hi=ce+hb,ov=Math.max(0,Math.min(hi,top*1000)-Math.max(lo,0));return ov/(2*hb)};
 for(let a=0;a<AZ;a++){const az=a-60,sx=Math.sin(rad(az)),cz=Math.cos(rad(az));let tau=0;const row=new Uint8Array(RB),trow=new Uint8Array(RB);
  for(let b=0;b<RB;b++){const r=(b+.5)*dr,x=r*sx,y=r*cz;let it=0;for(const cl of CELLS){const cx=cl.r*Math.sin(rad(cl.az)),cy=cl.r*Math.cos(rad(cl.az)),d2=(x-cx)**2+(y-cy)**2,g=Math.exp(-d2/(2*cl.s*cl.s));if(g>.01)it+=cl.p*g*frac(r,cl.top)}it=Math.min(1,it);const A=st.att?Math.exp(-K*tau):1;
   const dsp=it*A;row[b]=lvl(dsp);trow[b]=lvl(it);tau+=it*dr;if(trow[b]>row[b]){shadow++}if(row[b]>maxL)maxL=row[b]}L.push(row);TL.push(trow)}
 const lowEdge=st.tilt-BW/2,rg=lowEdge<0?H/(NMFT*Math.tan(rad(-lowEdge))):Infinity;
 return{L,TL,AZ,RB,shadow,maxL,rg,ctr:(H+rng*NMFT*Math.tan(rad(st.tilt)))/1000,frac}},
views:'<div class="sv"><canvas id="wxc" width="'+WX_W+'" height="'+WX_H+'" role="img" aria-label="Weather radar sector display"></canvas></div>'+SV('wxside','0 0 400 190','Side view of the beam'),
legend:'<ul class="legend"><li><b>L</b> light (solid turquoise)</li><li><b>M</b> moderate (dotted amber)</li><li><b>H</b> heavy (striped coral)</li><li>Grey speckle = ground returns</li><li>White diagonal lines = possible shadow</li></ul><p class="cap">Left: top-down sector display (aircraft at the bottom). Right: side view of the beam; heights are exaggerated. Colours are illustrative – they vary by equipment.</p>',
draw(st,c,root){const cv=$('#wxc',root),g=cv.getContext('2d'),img=g.createImageData(WX_W,WX_H),D=img.data,[ox,oy]=WX_O;let shx=0,shy=0,shn=0;
 for(let y=0;y<WX_H;y++)for(let x=0;x<WX_W;x++){const i=(y*WX_W+x)*4;let R=15,G=47,B=76;const dx=x-ox,dy=oy-y,rp=Math.hypot(dx,dy);
  if(dy>0&&rp<=WX_R){const az=deg(Math.atan2(dx,dy));if(Math.abs(az)<=60){R=11;G=32;B=54;const ai=clamp(Math.round(az+60),0,c.AZ-1),ri=Math.min(c.RB-1,Math.floor(rp/WX_R*c.RB)),lv=c.L[ai][ri],tl=c.TL[ai][ri];
   if(lv===1){R=45;G=212;B=191}else if(lv===2){const dt=(x%4===0&&y%4===0);R=dt?180:251;G=dt?120:191;B=dt?10:36}else if(lv===3){const st2=((x+y)%8<4);R=st2?251:190;G=st2?113:40;B=st2?133:70}
   if(tl>lv){if((x+y)%7===0){R=248;G=250;B=252}shx+=x;shy+=y;shn++}
   if(st.clut){const rn=rp/WX_R*st.rng;if(rn>=c.rg){const fg=clamp(.3+.6*Math.min(1,(rn-c.rg)/60),0,1);if(hash(x,y)<fg*.28){R=168;G=162;B=158}}}}}
  D[i]=R;D[i+1]=G;D[i+2]=B;D[i+3]=255}
 g.putImageData(img,0,0);g.strokeStyle='rgba(186,230,253,.55)';g.fillStyle='#E0F2FE';g.font='bold 13px system-ui,sans-serif';g.textAlign='center';g.lineWidth=1;
 for(let k=1;k<=4;k++){const r=WX_R*k/4;g.beginPath();g.arc(ox,oy,r,rad(-150),rad(-30));g.stroke();g.fillText(f0(st.rng*k/4)+(k===4?' NM':''),ox+22,oy-r+14)}
 [-60,-30,0,30,60].forEach(a=>{const p=pol(ox,oy,WX_R,a);g.beginPath();g.moveTo(ox,oy);g.lineTo(p[0],p[1]);g.stroke()});
 g.fillStyle='#fff';g.beginPath();g.moveTo(ox,oy-12);g.lineTo(ox+8,oy+8);g.lineTo(ox-8,oy+8);g.closePath();g.fill();
 const marks=[];CELLS.forEach(cl=>{if(cl.r<st.rng*.98){const p=pol(ox,oy,cl.r/st.rng*WX_R,cl.az),ai=clamp(Math.round(cl.az+60),0,c.AZ-1),ri=Math.min(c.RB-1,Math.floor(cl.r/st.rng*c.RB)),lv=c.L[ai][ri];marks.push([cl,p,lv])}});
 g.font='bold 14px system-ui,sans-serif';marks.forEach(([cl,p,lv])=>{const t=cl.n+(lv?' '+'LMH'[lv-1]:' –');g.lineWidth=4;g.strokeStyle='#0B2036';g.strokeText(t,p[0],p[1]+5);g.fillStyle='#fff';g.fillText(t,p[0],p[1]+5);
  if(st.dop&&cl.n==='B'&&lv>0){g.setLineDash([4,3]);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(p[0],p[1],20,0,7);g.stroke();g.setLineDash([]);g.font='bold 12px system-ui,sans-serif';g.strokeStyle='#0B2036';g.lineWidth=4;g.strokeText('T: turbulent motion (example)',p[0],p[1]-26);g.fillText('T: turbulent motion (example)',p[0],p[1]-26);g.font='bold 14px system-ui,sans-serif'}});
 if(st.clut&&c.rg<st.rng){const r=c.rg/st.rng*WX_R;g.setLineDash([5,4]);g.strokeStyle='#E7E5E4';g.lineWidth=2;g.beginPath();g.arc(ox,oy,r,rad(-120),rad(-60));g.stroke();g.setLineDash([]);g.font='bold 12px system-ui,sans-serif';g.fillStyle='#E7E5E4';g.lineWidth=4;g.strokeStyle='#0B2036';g.textAlign='left';g.strokeText('Dashed arc: ground returns begin ≈'+f0(c.rg)+' NM',8,16);g.fillText('Dashed arc: ground returns begin ≈'+f0(c.rg)+' NM',8,16)}
 if(shn>250){g.textAlign='center';g.font='bold 12px system-ui,sans-serif';g.lineWidth=4;g.strokeStyle='#0B2036';g.strokeText('Possible shadow',shx/shn,shy/shn);g.fillStyle='#fff';g.fillText('Possible shadow',shx/shn,shy/shn)}
 cv.setAttribute('aria-label','Weather radar sector display, range '+st.rng+' nautical miles, tilt '+st.tilt+' degrees. Highest displayed level: '+(['none','light','moderate','heavy'][c.maxL])+'. '+(c.rg<st.rng&&st.clut?'Ground returns shown beyond about '+f0(c.rg)+' nautical miles. ':'')+(c.shadow>250&&st.att?'A possible shadow is flagged behind a strong cell.':''));
 /* side view */
 const sc=340/st.rng,yG=170,yf=ft=>yG-ft/1000*3,ay=yf(st.alt*1000),h=a=>st.alt*1000+st.rng*NMFT*Math.tan(rad(a));let s='<rect x="0" y="'+yG+'" width="400" height="30" fill="#57534E"/>'+TX(200,186,'Ground',{s:10,c:'#E7E5E4'});
 CELLS.forEach(cl=>{const x1=30+(cl.r-cl.s)*sc,x2=30+(cl.r+cl.s)*sc;if(x1<385){const col=cl.p>=.7?'#FB7185':cl.p>=.4?'#FBBF24':'#2DD4BF';s+='<rect x="'+x1+'" y="'+yf(cl.top*1000)+'" width="'+Math.max(2,Math.min(x2,385)-x1)+'" height="'+(yG-yf(cl.top*1000))+'" fill="'+col+'" fill-opacity=".55" stroke="'+col+'" stroke-dasharray="3 2"/>'+TX(Math.min((x1+x2)/2,380),yf(cl.top*1000)-4,cl.n,{s:11})}});
 s+='<polygon points="30,'+ay+' 370,'+yf(h(st.tilt+BW/2))+' 370,'+yf(h(st.tilt-BW/2))+'" fill="#38BDF8" fill-opacity=".3" stroke="#38BDF8"/>'+LN(30,ay,370,yf(h(st.tilt)),'#FBBF24',2,'6 4')+'<g transform="translate(30,'+ay+') rotate(90) scale(.7)"><path d="'+PLANE+'" fill="#F8FAFC"/></g>';
 if(st.clut&&c.rg<st.rng)s+=LN(30+c.rg*sc,yG-24,30+c.rg*sc,yG,'#FB7185',2,'3 3')+TX(Math.min(30+c.rg*sc,330),yG-28,'beam meets ground',{s:10,c:'#FDA4AF'});
 s+=TX(60,16,'Tilt '+(st.tilt>0?'+':'')+f1(st.tilt)+'°',{s:12,w:700})+TX(300,16,'Altitude '+st.alt+',000 ft',{s:11,c:'#BAE6FD'});
 setSvg(root,'wxside',s,'Side view. Aircraft at '+st.alt+' thousand feet with antenna tilt '+st.tilt+' degrees. Storm cells A to E shown as blocks.'+(c.rg<st.rng?' The lower beam edge meets the ground at about '+f0(c.rg)+' nautical miles.':''))},
live(st,c){const hl=c.maxL?['','Light (L)','Moderate (M)','Heavy (H)'][c.maxL]:'None';let msg='';if(st.tilt>=6)msg='High tilt: the beam may overshoot low precipitation, so weather can disappear.';else if(c.rg<st.rng&&st.clut)msg='The lower part of the beam strikes the ground, adding ground returns beyond about '+f0(c.rg)+' NM.';else if(st.att&&c.shadow>250)msg='Shadow: weather behind a strong cell may be hidden or look weaker. Never assume a blank area is safe.';
 return{rows:[['Display range',st.rng+' NM'],['Antenna tilt',(st.tilt>0?'+':'')+f1(st.tilt)+'°'],['Beam centre height at max range',(c.ctr<0?'below ground (':'')+Math.round(c.ctr*1000).toLocaleString('en-US')+' ft'+(c.ctr<0?')':'')],['Ground returns begin',isFinite(c.rg)&&c.rg<st.rng?f0(c.rg)+' NM':'not in view'],['Highest level displayed',hl],['Shadow area flagged',st.att&&c.shadow>250?'Yes':'No']],eq:'Beam centre height = altitude + range × tan(tilt)<br>(flat-earth training simplification)',msg}},
